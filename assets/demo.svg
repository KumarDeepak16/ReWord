<linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".45"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<clipPath id="c2"><rect x="32" y="360" width="896" height="200" rx="14"/></clipPath>
</defs>
<rect width="960" height="604" rx="22" fill="#F3F4F8"/>
<rect width="960" height="604" rx="22" fill="url(#dots)"/>

<g transform="translate(30 16) scale(.17)"><rect width="256" height="256" rx="58" fill="url(#tile)"/><path d="M20 76 Q20 16 78 16 H178 Q236 16 236 76 Q128 116 20 76 Z" fill="url(#gloss)"/><g transform="translate(128 130) scale(.74) translate(-149 -133)"><rect x="50" y="36" width="34" height="34" rx="9" fill="#FFFFFF" opacity="0.62"/><rect x="90" y="36" width="34" height="34" rx="9" fill="#FFFFFF" opacity="0.72"/><rect x="130" y="36" width="34" height="34" rx="9" fill="#FFFFFF" opacity="0.8"/><rect x="50" y="76" width="34" height="34" rx="9" fill="#FFFFFF" opacity="0.7"/><rect x="170" y="76" width="34" height="34" rx="9" fill="#FFFFFF" opacity="0.92"/><rect x="50" y="116" width="34" height="34" rx="9" fill="#FFFFFF" opacity="0.78"/><rect x="90" y="116" width="34" height="34" rx="9" fill="#FFFFFF" opacity="0.88"/><rect x="130" y="116" width="34" height="34" rx="9" fill="#FFFFFF" opacity="1"/><rect x="50" y="156" width="34" height="34" rx="9" fill="#FFFFFF" opacity="0.86"/><rect x="50" y="196" width="34" height="34" rx="9" fill="#FFFFFF" opacity="0.95"/><path d="M150 136 C170 158 184 182 196 202 C204 216 218 220 230 206" fill="none" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/></g></g>
<text x="84" y="45" class="sans" font-size="22" font-weight="800" fill="#1A1C22">ReWord</text>
<text x="178" y="45" class="sans" font-size="14" fill="#6B7080">sounds like you wrote it</text>
<g class="sans"><rect x="560" y="22" width="96" height="30" rx="15" fill="#E7E9F0"/><rect x="560" y="22" width="96" height="30" rx="15" fill="#1A1C22" style="animation:k31 12.0s infinite;"/><text x="608.0" y="42" text-anchor="middle" class="pill" style="animation:k32 12.0s infinite;">1  Detect</text><rect x="666" y="22" width="136" height="30" rx="15" fill="#E7E9F0"/><rect x="666" y="22" width="136" height="30" rx="15" fill="#1A1C22" style="animation:k33 12.0s infinite;"/><text x="734.0" y="42" text-anchor="middle" class="pill" style="animation:k34 12.0s infinite;">2  Learn style</text><rect x="812" y="22" width="116" height="30" rx="15" fill="#E7E9F0"/><rect x="812" y="22" width="116" height="30" rx="15" fill="#1A1C22" style="animation:k35 12.0s infinite;"/><text x="870.0" y="42" text-anchor="middle" class="pill" style="animation:k36 12.0s infinite;">3  Rewrite</text></g>

<g style="animation:k37 12.0s infinite;">
<rect x="32" y="84" width="896" height="200" rx="14" fill="#FFFFFF" stroke="#E3E5EC" stroke-width="2"/>
<text x="56" y="112" class="sans lab" fill="#6B7080">AI DRAFT</text>
<g class="mono"><text x="56" y="142" textLength="683.4" lengthAdjust="spacingAndGlyphs"><tspan style="animation:k1 12.0s infinite;">In today&#x27;s rapidly evolving digital landscape</tspan>, UPI has emerged as a</text><text x="56" y="168" textLength="734.4" lengthAdjust="spacingAndGlyphs"><tspan style="animation:k3 12.0s infinite;">pivotal</tspan> force, <tspan style="animation:k5 12.0s infinite;">revolutionizing</tspan> the way Indians transact. <tspan style="animation:k7 12.0s infinite;">It&#x27;s not just a</tspan></text><text x="56" y="194" textLength="693.6" lengthAdjust="spacingAndGlyphs">payment system <tspan style="animation:k9 12.0s infinite;">— it&#x27;s a testament</tspan> to India&#x27;s commitment to financial</text><text x="56" y="220" textLength="734.4" lengthAdjust="spacingAndGlyphs">inclusion. By <tspan style="animation:k11 12.0s infinite;">seamlessly</tspan> connecting banks, merchants, and consumers, UPI</text><text x="56" y="246" textLength="724.2" lengthAdjust="spacingAndGlyphs"><tspan style="animation:k13 12.0s infinite;">fosters</tspan> <tspan style="animation:k15 12.0s infinite;">trust, convenience, and innovation</tspan>, <tspan style="animation:k17 12.0s infinite;">highlighting</tspan> its potential.</text></g>
<g class="strk"><path d="M56.0 137 L515.0 137" pathLength="1" stroke-dasharray="1" style="animation:k2 12.0s infinite;"/><path d="M56.0 163 L127.4 163" pathLength="1" stroke-dasharray="1" style="animation:k4 12.0s infinite;"/><path d="M209.0 163 L362.0 163" pathLength="1" stroke-dasharray="1" style="animation:k6 12.0s infinite;"/><path d="M637.4 163 L790.4 163" pathLength="1" stroke-dasharray="1" style="animation:k8 12.0s infinite;"/><path d="M209.0 189 L392.6 189" pathLength="1" stroke-dasharray="1" style="animation:k10 12.0s infinite;"/><path d="M198.8 215 L300.8 215" pathLength="1" stroke-dasharray="1" style="animation:k12 12.0s infinite;"/><path d="M56.0 241 L127.4 241" pathLength="1" stroke-dasharray="1" style="animation:k14 12.0s infinite;"/><path d="M137.6 241 L484.4 241" pathLength="1" stroke-dasharray="1" style="animation:k16 12.0s infinite;"/><path d="M504.8 241 L627.2 241" pathLength="1" stroke-dasharray="1" style="animation:k18 12.0s infinite;"/></g>
</g>

<g class="sans" font-size="13" font-weight="600"><g style="animation:k19 12.0s infinite;"><rect x="32" y="302" width="130" height="30" rx="15" fill="#FDE6DE"/><text x="97.0" y="322" text-anchor="middle" fill="#C23A1A">13 AI patterns</text></g><text x="176" y="322" fill="#6B7080" style="animation:k20 12.0s infinite;">your style:</text><g style="animation:k21 12.0s infinite;"><rect x="260" y="302" width="137" height="30" rx="15" fill="#DDF3E8"/><text x="328.5" y="322" text-anchor="middle" fill="#1E7A55">short sentences</text></g><g style="animation:k22 12.0s infinite;"><rect x="407" y="302" width="108" height="30" rx="15" fill="#DDF3E8"/><text x="461.0" y="322" text-anchor="middle" fill="#1E7A55">claim first</text></g><g style="animation:k23 12.0s infinite;"><rect x="525" y="302" width="93" height="30" rx="15" fill="#DDF3E8"/><text x="571.5" y="322" text-anchor="middle" fill="#1E7A55">uses e.g.</text></g><g style="animation:k24 12.0s infinite;"><rect x="628" y="302" width="108" height="30" rx="15" fill="#DDF3E8"/><text x="682.0" y="322" text-anchor="middle" fill="#1E7A55">plain words</text></g><g style="animation:k25 12.0s infinite;"><rect x="746" y="302" width="108" height="30" rx="15" fill="#DDF3E8"/><text x="800.0" y="322" text-anchor="middle" fill="#1E7A55">one opinion</text></g></g>

<rect x="32" y="360" width="896" height="200" rx="14" fill="#FFFFFF"/>
<text x="56" y="390" class="sans lab" fill="#1E7A55">REWORD</text>
<g clip-path="url(#c2)">
<g class="sans" font-size="18" fill="#1A1C22"><text x="56" y="422">UPI made instant bank-to-bank payments free for ordinary users,</text><text x="56" y="450">and that changed small payments in India more than cards ever did.</text><text x="56" y="478">A vegetable seller with a printed QR code can now take payments</text><text x="56" y="506">without buying a card machine. The open question is cost: someone</text><text x="56" y="534">has to pay to run it, and right now that isn&#x27;t the user.</text></g>
<rect x="52" y="402" width="640" height="28" fill="#FFFFFF" style="animation:k26 12.0s infinite;"/><rect x="52" y="430" width="640" height="28" fill="#FFFFFF" style="animation:k27 12.0s infinite;"/><rect x="52" y="458" width="640" height="28" fill="#FFFFFF" style="animation:k28 12.0s infinite;"/><rect x="52" y="486" width="640" height="28" fill="#FFFFFF" style="animation:k29 12.0s infinite;"/><rect x="52" y="514" width="640" height="28" fill="#FFFFFF" style="animation:k30 12.0s infinite;"/>
</g>
<rect x="32" y="360" width="896" height="200" rx="14" fill="none" stroke-width="2" style="animation:k38 12.0s infinite;"/>
<g transform="translate(740 382) scale(.62)"><rect width="256" height="256" rx="58" fill="url(#tile)"/><path d="M20 76 Q20 16 78 16 H178 Q236 16 236 76 Q128 116 20 76 Z" fill="url(#gloss)"/><g transform="translate(128 130) scale(.74) translate(-149 -133)"><rect x="50" y="36" width="34" height="34" rx="9" fill="#FFFFFF" style="animation:k39 12.0s infinite;"/><rect x="90" y="36" width="34" height="34" rx="9" fill="#FFFFFF" style="animation:k40 12.0s infinite;"/><rect x="130" y="36" width="34" height="34" rx="9" fill="#FFFFFF" style="animation:k41 12.0s infinite;"/><rect x="50" y="76" width="34" height="34" rx="9" fill="#FFFFFF" style="animation:k42 12.0s infinite;"/><rect x="170" y="76" width="34" height="34" rx="9" fill="#FFFFFF" style="animation:k43 12.0s infinite;"/><rect x="50" y="116" width="34" height="34" rx="9" fill="#FFFFFF" style="animation:k44 12.0s infinite;"/><rect x="90" y="116" width="34" height="34" rx="9" fill="#FFFFFF" style="animation:k45 12.0s infinite;"/><rect x="130" y="116" width="34" height="34" rx="9" fill="#FFFFFF" style="animation:k46 12.0s infinite;"/><rect x="50" y="156" width="34" height="34" rx="9" fill="#FFFFFF" style="animation:k47 12.0s infinite;"/><rect x="50" y="196" width="34" height="34" rx="9" fill="#FFFFFF" style="animation:k48 12.0s infinite;"/><path d="M150 136 C170 158 184 182 196 202 C204 216 218 220 230 206" fill="none" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" style="animation:k49 12.0s infinite;"/></g></g>

<g class="sans" font-size="14" font-weight="600">
<text x="480" y="588" text-anchor="middle" fill="#D9431F" style="animation:k50 12.0s infinite;">13 AI patterns  ·  sounds like a bot</text>
<text x="480" y="588" text-anchor="middle" fill="#1E7A55" style="animation:k51 12.0s infinite;">0 AI patterns  ·  sounds like you</text>
